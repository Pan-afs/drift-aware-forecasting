[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-aware-forecasting"
version = "0.1.0"
description = "Open-data time-series pipeline with drift-aware quality checks and a compressed Chronos-Bolt forecaster."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.2",
  "requests>=2.31",
  "clickhouse-connect>=0.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
forecast = ["torch>=2.2", "chronos-forecasting>=1.4", "psutil>=5.9"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
