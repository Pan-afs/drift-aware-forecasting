fred:
  start: "1990-01-01"
  # FRED revises recent values and runs annual benchmark revisions, so each
  # run re-pulls this many days of history.
  revision_lookback_days: 400
  series:
    - id: UNRATE      # Unemployment rate, monthly
    - id: PAYEMS      # Total nonfarm payrolls, monthly
    - id: ICSA        # Initial jobless claims, weekly (sharp COVID-19 break)
    - id: CPIAUCSL    # Consumer price index, monthly
    - id: FEDFUNDS    # Effective federal funds rate, monthly
    - id: DGS10       # 10-year Treasury yield, daily
    - id: INDPRO      # Industrial production index, monthly
    - id: GDPC1       # Real GDP, quarterly
    - id: DEXUSEU     # USD per EUR exchange rate, daily
  # Series expected to react to the same shocks. A persistent shift seen in
  # peers too is treated as real drift; an isolated one is questioned.
  peer_groups:
    labour: [UNRATE, PAYEMS, ICSA]
    prices_and_rates: [CPIAUCSL, FEDFUNDS, DGS10]
    activity: [INDPRO, GDPC1, PAYEMS]

telecom_milan:
  doi: "doi:10.7910/DVN/EGZHFV"
  start: "2013-11-01"
  end: "2014-01-01"
  freq: "1h"
  # Weekly cycle at hourly resolution; weekday and weekend traffic differ a lot.
  seasonal_period: 168
  activities: [internet, call_in, sms_in]
  # Grid cells (1..10000) to keep as individual series next to the city total.
  # Cells around the city centre; edit to taste.
  squares: [5060, 5061, 5160, 4159, 4556]
  # Hours of identical traffic before a series is flagged as a stuck feed.
  flatline_run: 6
